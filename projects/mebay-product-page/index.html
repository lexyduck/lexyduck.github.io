<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mebay Product Page</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="single-column">
            <div class="top">
                <h4>Mebay</h4>
            </div>
            <div id="layout">
                <div id="thumbnail-column">
                    <div class="image-container">
                        <img 
                            src="images/duck-shark.webp" 
                            alt="plastic duck in a shark custom"
                        >
                    </div>
                </div>

                <div id="featured-image-column">
                    <div class="image-container-one">
                        <img 
                            src="images/one-duck.avif" 
                            alt="Plastic Duck in a shark custom"
                        >
                    </div>
                </div>
                <div id="product-info-column" class="two-column">
                    <H4>
                        <a href="#" class="head">Walmart "Infantino Store"</a>
                    </H4>
                    <p class="part">
                        <a href="#">4.8% postive Stars</a>
                        &middot;
                        <a href="#">Infantino Store</a>
                        &middot;
                        <a href="#">Infantino</a>
                    </p>
                    <a href="#"n class="money">$$1.00</a> 
                    <a href="#" class="btn-one">BUY</a>
                    <a href="#" class="btn">ADD To Cart</a>
                    <a href="#" class="btn">Add To Wishlist</a>
                </div>
            </div>
        </div>
    </body> 
</html>
