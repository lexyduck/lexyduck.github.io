<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it blue">
                <img 
                    class="pin" 
                    src="images/circle.png"
                    alt="circle"
                >
                <h2>leeb, leefuh, lurve</h2>
                <p>Sims 4 Loading screen</p>
            </div>
            <div class="post-it grey">
                <img 
                    class="pin" 
                    src="images/circle.png"
                    alt="circle"
                >
                <h1>CHEESE IS FROM?</h1>
                <p>The Moon!</p>
            </div>
            <div class="post-it purple">
                <img 
                    class="pin"
                    src="images/circle.png"
                    alt="circle"
                >
                <img 
                    src="images/dog.jpg"
                    width="100"
                    alt="pug in clothes"
                >
            </div>
            <br>
            <!-- Second row -->
            <div class="post-it  pinpink">
                <img 
                    class="pin" 
                    src="images/circle.png"
                    alt="circle"
                >
                <h1>Why is a Pineapple?</h1>
                <p>Not an apple!</p>
            </div>
            <div class="post-it yellow">
                <img 
                    class="pin" 
                    src="images/circle.png"
                    alt="circle"
                >
                <h1>Pepper jack cheese</h1>
            </div>
            <div class="post-it brown">
                <img 
                    class="pin" 
                    src="images/circle.png"
                    alt="circle"
                >
                <h1>Note to self</h1>
                <ul>
                    <li>Dont eat root murshrooms</li>
                    <li>Apple on the brenches are better</li>
                    <li>Dont trust a fairy!</li>
                </ul>
            </div>

        </div>
    </body>
</html>
