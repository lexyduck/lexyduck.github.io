<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="color-palette">
            <h2>Sweet Salmon Pie</h2>
            <h4 id="p1-1" class="color">#EA9E8D</h4>
            <H4 id="p1-2" class="color">#D64550</h4>
            <h4 id="p1-3" class="color">#1C2826</h4>
        </div>
        <div class="color-palette">
            <h2>Sweet Duck Pie</h2>
            <h4 id="p2-1" class="color">#FFFBDB</h4>
            <H4 id="p2-2" class="color">#CDC7E5</h4>
            <h4 id="p2-3" class="color">#D3EFBD</h4>
        </div>
        <div class="color-palette">
            <h2>Sweet Fish Pie</h2>
            <h4 id="p3-1" class="color">#2E3532</h4>
            <H4 id="p3-2" class="color">#8B2635</h4>
            <h4 id="p3-3" class="color">#E0E2DB</h4>
        </div>
    </body> 
</html>
